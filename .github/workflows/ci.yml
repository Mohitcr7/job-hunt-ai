name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q agents graph tools review api config.py main.py job_hunt_agent.py provision_bedrock.py

  tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Full requirements pull in PyTorch via sentence-transformers (~2GB) —
      # the smoke tests never call the embedding model, so numpy/faiss-cpu
      # (lightweight, no torch) are enough to satisfy vector_store_tool's
      # module-level imports.
      - name: Install test dependencies
        run: pip install pytest python-dotenv loguru pydantic fastapi httpx python-multipart langchain-core numpy faiss-cpu openpyxl
      - name: Run smoke tests
        run: python -m pytest tests/ -q
